spring.application.name=food

# SERVER CONFIG
server.port=8080

# DATABASE CONFIG (MySQL) - Using environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE CONFIG
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# LOGGING
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_BINDER_LOG_LEVEL:WARN}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.level.com.example.food=${APP_LOG_LEVEL:INFO}

# DEVTOOLS (AUTO RESTART)
spring.devtools.restart.enabled=true

# JWT CONFIGURATION - Values from environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Security Configuration
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie.domain=${COOKIE_DOMAIN:localhost}

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}